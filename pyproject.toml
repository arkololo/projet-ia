[project]
name = "helpdesk-kit"
version = "0.1.0"
description = "HelpDesk-AI red-team kit (CPE Lyon)"
requires-python = "==3.12.*"
dependencies = [
    "ollama>=0.4,<1.0",
    "numpy>=1.26,<3.0",
    "cryptography>=42,<47",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"helpdesk_agent" = "helpdesk_agent"
